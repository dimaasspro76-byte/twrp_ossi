name: Build TWRP (ossi / OPPO CPH2477)

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "minimal-manifest TWRP branch"
        default: "twrp-12.1"
      build_target:
        description: "make target (bootimage for A/B recovery-as-boot)"
        default: "bootimage"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout device tree (this repo)
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 rsync bc cpio lz4 xz-utils ccache openjdk-11-jdk-headless
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"
          git config --global color.ui false

      - name: Sync minimal TWRP manifest
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b "${{ inputs.manifest_branch }}"
          ~/bin/repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags
          du -sh ~/twrp

      - name: Put device tree in place
        run: |
          mkdir -p ~/twrp/device/oplus/ossi
          rsync -a --exclude '.git' --exclude '.github' "$GITHUB_WORKSPACE/device_tree/" ~/twrp/device/oplus/ossi/
          ls -la ~/twrp/device/oplus/ossi ~/twrp/device/oplus/ossi/prebuilt

      - name: Build
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          set +u
          source build/envsetup.sh
          lunch twrp_ossi-eng
          mka ${{ inputs.build_target }} -j"$(nproc)"

      - name: Collect output
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp ~/twrp/out/target/product/ossi/boot.img "$GITHUB_WORKSPACE/out/twrp-boot.img" || true
          cp ~/twrp/out/target/product/ossi/recovery.img "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-ossi
          path: out/*
          if-no-files-found: error
